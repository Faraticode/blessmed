<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){var t=localStorage.getItem("blessmed_theme")||"dark";document.documentElement.setAttribute("data-theme",t);})();</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Quiz — BlessMed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6" />
<link rel="stylesheet" href="css/chain.css?v=3" />
<style>
  .quiz-question { margin-bottom: 26px; }
  .quiz-question:last-child { margin-bottom: 0; }
  .quiz-question h4 { color: var(--chain-text); font-family: var(--font-display); margin-bottom: 12px; font-size: 16px; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-option {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--chain-border); background: #0F0A18;
    color: var(--chain-text); cursor: pointer; font-size: 14px;
  }
  .quiz-option:hover { border-color: var(--chain-purple-light); }
  .quiz-option input { accent-color: var(--chain-purple); }
  .quiz-option.correct { border-color: var(--success); background: rgba(46,158,107,0.12); }
  .quiz-option.incorrect { border-color: var(--coral); background: rgba(232,96,76,0.12); }
  .quiz-explanation { font-size: 13px; color: var(--chain-text-muted); margin-top: 8px; }
  .quiz-score-banner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-radius: var(--radius-md); margin-bottom: 20px;
    background: var(--card-purple); color: var(--card-purple-ink);
  }
  .quiz-score-banner h3 { color: inherit; margin: 0; font-size: 26px; }
  .quiz-score-banner span { font-size: 13px; opacity: 0.8; }
  .quiz-streak-note { font-size: 12px; color: var(--chain-text-muted); margin-top: 6px; }
</style>
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <div class="main-content chain-zone">
    <div class="page-header">
      <h1>Daily Health Quiz <span class="chain-badge">Testnet demo</span></h1>
      <p>Answer 5 quick questions each day to learn something new and earn on-chain points — visit <a href="blockchain.html" style="color:var(--chain-purple-light);">Blockchain</a> first to connect your wallet.</p>
    </div>

    <div id="alert-box"></div>

    <div id="quiz-container" class="chain-card">
      <p>Loading today's quiz…</p>
    </div>
  </div>
</div>

<script src="js/api.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
<script src="js/nav.js?v=2?v=4"></script>
<script>
  Auth.requireLogin();
  renderSidebar('quiz');
</script>

<script type="module">
  import './js/stacks.js?v=3';
</script>
<script type="module">
  function whenStacksReady(callback) {
    if (window.Stacks) return callback();
    const interval = setInterval(() => { if (window.Stacks) { clearInterval(interval); callback(); } }, 100);
  }

  const container = document.getElementById('quiz-container');
  let latestResult = null; // holds the today payload once answered, for the claim button

  function renderResults(data) {
    const pointsLeft = data.pointsEarned - (data.claimedPoints || 0);
    container.innerHTML = `
      <div class="quiz-score-banner">
        <div>
          <h3>${data.score} / ${data.totalQuestions} correct</h3>
          <span>+${data.pointsEarned} points earned today</span>
        </div>
        ${data.claimable
          ? `<button class="chain-btn-primary" id="claim-quiz-btn">Claim ${pointsLeft} pts on-chain</button>`
          : `<span style="font-size:13px; color: inherit; opacity:0.8;">All claimed ✓</span>`}
      </div>
      <div id="claim-result"></div>
      ${data.questions.map(q => `
        <div class="quiz-question">
          <h4>${q.question}</h4>
          <div class="quiz-options">
            ${q.options.map((opt, i) => {
              let cls = 'quiz-option';
              if (i === q.correctIndex) cls += ' correct';
              else if (i === q.yourAnswer) cls += ' incorrect';
              return `<div class="${cls}">${opt}</div>`;
            }).join('')}
          </div>
          ${q.explanation ? `<div class="quiz-explanation">${q.explanation}</div>` : ''}
        </div>
      `).join('')}
      <p class="quiz-streak-note">Come back tomorrow for a fresh set of questions.</p>
    `;

    if (data.claimable) {
      document.getElementById('claim-quiz-btn').addEventListener('click', claimQuizPoints);
    }
  }

  function renderQuizForm(data) {
    container.innerHTML = `
      <form id="quiz-form">
        ${data.questions.map((q, qi) => `
          <div class="quiz-question">
            <h4>${qi + 1}. ${q.question}</h4>
            <div class="quiz-options">
              ${q.options.map((opt, oi) => `
                <label class="quiz-option">
                  <input type="radio" name="q${qi}" value="${oi}" required />
                  ${opt}
                </label>
              `).join('')}
            </div>
          </div>
        `).join('')}
        <button type="submit" class="chain-btn-primary">Submit answers</button>
      </form>
    `;

    document.getElementById('quiz-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert('alert-box');

      const answers = data.questions.map((_, qi) => {
        const checked = document.querySelector(`input[name="q${qi}"]:checked`);
        return checked ? Number(checked.value) : -1;
      });

      try {
        const result = await apiRequest('/quiz/submit', { method: 'POST', body: { answers } });
        latestResult = result;
        renderResults(result);
      } catch (err) {
        showAlert('alert-box', err.message);
      }
    });
  }

  async function loadQuiz() {
    try {
      const data = await apiRequest('/quiz/today');
      if (data.completed) {
        latestResult = data;
        renderResults(data);
      } else {
        renderQuizForm(data);
      }
    } catch (err) {
      container.innerHTML = '';
      showAlert('alert-box', err.message);
    }
  }

  whenStacksReady(() => {
    const { Stacks } = window;

    window.claimQuizPoints = async function claimQuizPoints() {
      const resultBox = document.getElementById('claim-result');
      resultBox.innerHTML = '';

      if (!Stacks.isConnected()) {
        resultBox.innerHTML = `<div class="chain-alert">Connect your wallet on the Blockchain page first.</div>`;
        return;
      }
      if (!latestResult || !latestResult.claimable) {
        resultBox.innerHTML = `<div class="chain-alert">No new quiz points to claim yet.</div>`;
        return;
      }

      try {
        const pointsToAward = latestResult.pointsEarned - (latestResult.claimedPoints || 0);
        const { txid } = await Stacks.earnPoints(pointsToAward);
        await apiRequest('/quiz/claim', { method: 'PUT' });
        resultBox.innerHTML = `<div class="chain-success">Claimed +${pointsToAward} points! <a class="tx-link" href="https://explorer.hiro.so/txid/${txid}?chain=testnet" target="_blank" style="color:#6BE0A6;">View transaction</a></div>`;
        await loadQuiz();
      } catch (err) {
        resultBox.innerHTML = `<div class="chain-alert">${err.message}</div>`;
      }
    };
  });

  loadQuiz();
</script>
</body>
</html>
